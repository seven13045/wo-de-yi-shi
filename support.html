  <h1>「一事」技术支持</h1>
  <p class="muted">不用登录。打开就像在纸上写。</p>

  <h2>怎么记</h2>
  <ol>
    <li>在下面的输入栏写下一件事，点箭头。</li>
    <li>点圆圈，这件事就勾掉。只有圆圈会勾，点文字不会。</li>
    <li>右滑可以改字和日期，左滑可以删。</li>
  </ol>

  <h2>日历</h2>
  <p>顶上可以切月、周、日。点某一天，能看见这天已经完成的，和还没完成的。</p>
  <p>没勾掉的，过了当天会进入下一天。勾掉的留在原来那天。</p>

  <h2>小组件</h2>
  <p>在主屏幕添加「一事」。上面是今天和总体各完成了几件。点一下就能勾。勾掉的第二天从小组件里划走。</p>
